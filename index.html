<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SMKAMi</title>
  <meta name="description" content="SMKAMi – Aplikasi Guru">
  <meta name="theme-color" content="#0b3fd1">
  <meta name="apple-mobile-web-app-title" content="SMKAMi">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root { --biru: #0b3fd1; --biru-gelap: #072a8f; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      padding: 24px 16px; text-align: center; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(150deg, #1a5cf5 0%, var(--biru) 45%, var(--biru-gelap) 100%);
    }
    img { width: min(42vw, 180px); height: auto; border-radius: 22%; box-shadow: 0 18px 40px rgba(0, 0, 0, .3); }
    h1 { font-size: 22px; letter-spacing: .5px; }
    p { font-size: 14px; opacity: .85; }
    .putar { width: 26px; height: 26px; border: 3px solid rgba(255, 255, 255, .35); border-top-color: #fff; border-radius: 50%; animation: putar .8s linear infinite; }
    @keyframes putar { to { transform: rotate(360deg); } }
    a.butang { display: inline-block; margin-top: 6px; padding: 12px 22px; border-radius: 14px; background: #fff; color: var(--biru); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <img src="ikon-512.png" alt="Logo SMKAMi">
  <h1>SMKAMi – Aplikasi Guru</h1>
  <div class="putar" aria-hidden="true"></div>
  <p>Membuka aplikasi…</p>
  <a class="butang" id="buka" href="#">Buka Aplikasi</a>
  <script>
    // Pautan aplikasi (deployment beta Apps Script). Tukar di sini sahaja jika pautan berubah.
    var APLIKASI = 'https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbwlcfyPHZePt8G0Txc6lGs0eMcYAJSGPE58aVTCYp-JD_akJf938fH2QcQzjr5OKv0H/exec';
    document.getElementById('buka').href = APLIKASI;
    setTimeout(function () { location.replace(APLIKASI); }, 600);
  </script>
</body>
</html>
