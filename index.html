<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SMKAMi</title>
  <meta name="description" content="SMKAMi – Aplikasi Guru">
  <meta name="theme-color" content="#0b3fd1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SMKAMi">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root { --biru: #0b3fd1; --biru-gelap: #072a8f; }
    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      padding: 24px 16px; text-align: center; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(150deg, #1a5cf5 0%, var(--biru) 45%, var(--biru-gelap) 100%);
    }
    img { width: min(42vw, 170px); height: auto; border-radius: 22%; box-shadow: 0 18px 40px rgba(0, 0, 0, .3); }
    h1 { font-size: 22px; letter-spacing: .5px; }
    a.butang { display: block; width: 100%; max-width: 320px; padding: 14px; border-radius: 14px; background: #fff; color: var(--biru); font-weight: 700; text-decoration: none; }
    ol { width: 100%; max-width: 320px; padding: 14px 16px 14px 34px; border-radius: 14px; background: rgba(255, 255, 255, .12); text-align: left; font-size: 14px; line-height: 1.5; }
    .putar { display: none; width: 26px; height: 26px; border: 3px solid rgba(255, 255, 255, .35); border-top-color: #fff; border-radius: 50%; animation: putar .8s linear infinite; }
    @keyframes putar { to { transform: rotate(360deg); } }
    /* Dibuka dari ikon skrin utama: hanya logo dan pemutar dipaparkan sementara aplikasi dibuka */
    .alih .butang, .alih ol { display: none; }
    .alih .putar { display: block; }
  </style>
  <script>
    /* Halaman ini mesti kekal dalam pelayar supaya Add to Home Screen menyimpan logo; alih ke aplikasi hanya bila dibuka dari skrin utama. */
    if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
      document.documentElement.classList.add('alih');
    }
  </script>
</head>
<body>
  <img src="ikon-512.png" alt="Logo SMKAMi">
  <h1>SMKAMi – Aplikasi Guru</h1>
  <div class="putar" aria-hidden="true"></div>
  <a class="butang" id="buka" href="https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbwlcfyPHZePt8G0Txc6lGs0eMcYAJSGPE58aVTCYp-JD_akJf938fH2QcQzjr5OKv0H/exec">Buka Aplikasi</a>
  <ol>
    <li>Tekan butang <b>Kongsi</b> (iPhone) atau menu <b>⋮</b> (Android).</li>
    <li>Pilih <b>Add to Home Screen</b>.</li>
    <li>Buka SMKAMi melalui ikon logo di skrin utama.</li>
  </ol>
  <script>
    // Pautan aplikasi ialah href butang "Buka Aplikasi" di atas; tukar di situ sahaja jika pautan berubah.
    if (document.documentElement.classList.contains('alih')) {
      window.location.replace(document.getElementById('buka').href);
    }
  </script>
</body>
</html>
